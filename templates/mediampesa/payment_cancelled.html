{% extends 'base.html' %}

{% block title %}Payment Cancelled{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-warning">
                <div class="card-header bg-warning text-white">
                    <h3 class="card-title">Payment Cancelled</h3>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
                    <h4 class="mt-3">Your payment was cancelled.</h4>
                    <p>You can try again whenever you're ready.</p>
                    <a href="{% url 'media_assets:dashboard' %}" class="btn btn-primary">Try Again</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
