{% extends 'base.html' %}

{% block title %}Payment Successful{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-success">
                <div class="card-header bg-success text-white">
                    <h3 class="card-title">Payment Successful</h3>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                    <h4 class="mt-3">Your payment was successful!</h4>
                    <p>Thank you for your payment. Your transaction has been processed.</p>
                    <a href="{% url 'media_assets:dashboard' %}" class="btn btn-primary">Continue</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
